name: romm

volumes:
  romm_resources:
  romm_redis_data:
  romm_db_data:

services:
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: romm-db
      DB_NAME: ${DB_NAME:-romm}
      DB_USER: ${DB_USER:-romm-user}
      DB_PASSWD: ${DB_PASSWD?required}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY?required}
      SCREENSCRAPER_USER: ${SCREENSCRAPER_USER:-}
      SCREENSCRAPER_PASSWORD: ${SCREENSCRAPER_PASSWORD:-}
      RETROACHIEVEMENTS_API_KEY: ${RETROACHIEVEMENTS_API_KEY:-}
      STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY:-}
      HASHEOUS_API_ENABLED: ${HASHEOUS_API_ENABLED:-true}
      SCAN_WORKERS: ${SCAN_WORKERS:-4}
      WEB_SERVER_CONCURRENCY: ${WEB_SERVER_CONCURRENCY:-4}
    volumes:
      - romm_resources:/romm/resources
      - romm_redis_data:/redis-data
      - ${LIBRARY_HOST_PATH:-./library}:/romm/library
      - ${ASSETS_HOST_PATH:-./assets}:/romm/assets
      - ${CONFIG_HOST_PATH:-./config}:/romm/config
    ports:
      - "${APP_PORT:-80}:8080"
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true

  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWD?required}
      MARIADB_DATABASE: ${DB_NAME:-romm}
      MARIADB_USER: ${DB_USER:-romm-user}
      MARIADB_PASSWORD: ${DB_PASSWD?required}
    volumes:
      - romm_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
